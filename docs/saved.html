<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="assets/logo.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Clinics | Dental Compare</title>
    <meta name="description" content="Your saved dental clinics on Dental Compare NZ.">
    <link rel="canonical" href="https://dentalcompare.co.nz/saved.html">
    <link rel="stylesheet" href="assets/css/styles.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4J758VJQVX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-4J758VJQVX');
    </script>
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="container header__inner">
            <a href="/" class="logo">
                <img src="assets/images/logo.png" alt="Dental Compare" class="logo__img">
            </a>
            <nav class="nav" id="main-nav">
                <a href="/" class="nav__link">Home</a>
                <a href="/#locations" class="nav__link">All Regions</a>
                <a href="faq.html" class="nav__link">FAQ</a>
                <a href="saved.html" class="nav__link nav__link--active">Saved</a>
            </nav>
            <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <!-- Page hero -->
    <section class="hero hero--sm">
        <div class="container">
            <h1>Saved Clinics</h1>
            <p>Clinics you've saved for easy comparison.</p>
        </div>
    </section>

    <!-- Listings -->
    <section class="section" style="padding-top: var(--sp-8);">
        <div class="container">
            <div class="listings-header">
                <span class="listings-header__count" id="results-count"></span>
                <select class="sort-select" id="sort-select">
                    <option value="reviews" selected>Most reviewed</option>
                    <option value="rating">Highest rated</option>
                    <option value="price">Lowest price</option>
                    <option value="name">A – Z</option>
                </select>
            </div>
            <div class="dentist-grid" id="dentist-grid" data-mode="saved"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer__copy">Built in New Zealand</div>
        </div>
    </footer>

    <script src="assets/js/supabase.js"></script>
    <script src="assets/js/app.js"></script>
</body>

</html>
